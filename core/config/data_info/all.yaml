# @package data
#
# Shared dataset lookup table for ALL configs (stage1/2 pretrain + stage3 finetune).
# data_info is consumed purely as a name -> {path, view_map} lookup, keyed by whatever
# datasets the active `data_mix` selects (see lerobot_dataset_pretrain_mp.py). Entries
# not referenced by the current mixture are simply ignored, so every config shares
# this single union. Pull it in via a Hydra defaults list entry: `- data_info: all`.
#
# Every dataset path is rooted at `data_root` below via ${data.data_root} interpolation
# (resolved by OmegaConf when the config is flattened). Override the root for a
# different machine with e.g.  data.data_root=/other/path  on the command line.
data_root: ./data

data_info:
  # ===== Pretraining datasets (stage1-latent-pretrain / stage2-vla-pretrain) =====

